<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;

            /* Base color for the whole page */
            background-color: rgba(0, 0, 0, 1);
        }

        /* Bottom gradient strip (supports border-radius) */
        body::after {
            content: "";
            position: fixed;
            left: 0;
            bottom: 0;

            /* Bottom-left only: controls how far it spreads (right/up) */
            width: 100vw;
            height: 50vh;

            background: radial-gradient(ellipse farthest-side at 0% 100%,
                    rgba(228, 12, 12, 0.95) 0%,
                    rgba(228, 12, 12, 0.65) 30%,
                    rgba(228, 12, 12, 0.25) 60%,
                    rgba(228, 12, 12, 0) 100%);

            /* Optional: slightly rounded top edge */
            /* border-top-right-radius: 20px; */

            pointer-events: none;
            z-index: -1;
        }

        /* Elegant Quote Styling */
        .quote-container {
            position: absolute;
            top: 38%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            z-index: 10;
        }

        .subtitle {
            margin: 0;
            color: rgba(255, 255, 255, 0.6);
            font-family: "Georgia", "Times New Roman", serif;
            font-style: italic;
            font-size: clamp(1.2rem, 2vw, 1.8rem);
            font-weight: 300;
            letter-spacing: 4px;
        }

        .title {
            margin: 0;
            color: #ffffff;
            font-family: "Didot", "Playfair Display", "Times New Roman", serif;
            font-size: clamp(2rem, 6vw, 6rem);
            font-weight: normal;
            letter-spacing: 12px;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(228, 12, 12, 0.6), 0 0 15px rgba(255, 255, 255, 0.2);
            /* Padding to compensate for tracking & keep it visually centered */
            padding-left: 12px;
        }
    </style>
</head>

<body>
    <div class="quote-container">
        <p class="subtitle">The Time Is</p>
        <h1 class="title">NOW</h1>
    </div>
</body>

</html>
